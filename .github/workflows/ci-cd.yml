name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions/setup-rust@v1
        with:
          rust-version: stable
      - name: Build Backend
        run: cargo build --release
      - name: Test Backend
        run: cargo test --all
      - name: Build Docker Image (Backend)
        run: docker build -t solana-memecoin-bot-backend .
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push Docker Image (Backend)
        run: docker tag solana-memecoin-bot-backend ${{ secrets.DOCKERHUB_USERNAME }}/solana-memecoin-bot-backend:latest && docker push ${{ secrets.DOCKERHUB_USERNAME }}/solana-memecoin-bot-backend:latest
      - name: Notify Telegram (Backend)
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="[CI/CD] Backend build ${{ job.status }} on ${{ github.repository }}@${{ github.sha }}"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Frontend
        run: npm run build
      - name: Test Frontend
        run: npm run test || true
      - name: Build Docker Image (Frontend)
        run: docker build -t solana-memecoin-bot-frontend .
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push Docker Image (Frontend)
        run: docker tag solana-memecoin-bot-frontend ${{ secrets.DOCKERHUB_USERNAME }}/solana-memecoin-bot-frontend:latest && docker push ${{ secrets.DOCKERHUB_USERNAME }}/solana-memecoin-bot-frontend:latest
      - name: Notify Telegram (Frontend)
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="[CI/CD] Frontend build ${{ job.status }} on ${{ github.repository }}@${{ github.sha }}"
